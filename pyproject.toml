[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-artcraft-plugin"
version = "0.2.0"
description = "Hermes Agent plugin and stdio MCP server for PhotoCraft, LightCraft, FilmCraft, and SoundCraft CLIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/wspotter/hermes-artcraft-plugin"
Repository = "https://github.com/wspotter/hermes-artcraft-plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["artcraft_plugin*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
