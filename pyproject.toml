[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-artcraft-plugin"
version = "0.1.0"
description = "Hermes Agent plugin for ArtCraft apps (PhotoCraft, LightCraft) with non-destructive guards and automatic pixel-diff verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["artcraft_plugin*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
